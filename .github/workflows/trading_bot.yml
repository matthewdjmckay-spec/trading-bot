name: Trading Bot Check

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: trading-bot-run
  cancel-in-progress: false

jobs:
  check-and-trade:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run one signal/trade check
        env:
          OANDA_API_TOKEN: ${{ secrets.OANDA_API_TOKEN }}
          OANDA_ACCOUNT_ID: ${{ secrets.OANDA_ACCOUNT_ID }}
          OANDA_ENVIRONMENT: practice
          DISCORD_WEBHOOK_GOLD: ${{ secrets.DISCORD_WEBHOOK_GOLD }}
          DISCORD_WEBHOOK_EURUSD: ${{ secrets.DISCORD_WEBHOOK_EURUSD }}
          DISCORD_WEBHOOK_GBPUSD: ${{ secrets.DISCORD_WEBHOOK_GBPUSD }}
          DISCORD_WEBHOOK_USDJPY: ${{ secrets.DISCORD_WEBHOOK_USDJPY }}
          DISCORD_WEBHOOK_AUDUSD: ${{ secrets.DISCORD_WEBHOOK_AUDUSD }}
          DISCORD_WEBHOOK_USDCAD: ${{ secrets.DISCORD_WEBHOOK_USDCAD }}
          DISCORD_WEBHOOK_RESULTS: ${{ secrets.DISCORD_WEBHOOK_RESULTS }}
        run: python3 run_once.py

      - name: Save bot memory back to the repo
        run: |
          git config user.name "trading-bot"
          git config user.email "trading-bot@users.noreply.github.com"
          for f in alerted_state.json open_trades.json trade_stats.json trade_history.json; do
            if [ -f "$f" ]; then
              git add "$f"
            fi
          done
          if ! git diff --quiet --cached; then
            git commit -m "Update bot state [skip ci]"
            git pull --rebase origin main
            git push
          fi
