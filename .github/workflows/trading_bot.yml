name: Trading Bot Check

on:
  schedule:
    - cron: "*/15 * * * *"   # runs every 15 minutes, all day, every day
  workflow_dispatch:          # lets you also trigger it manually from the GitHub website

jobs:
  check-and-trade:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run one signal/trade check
        env:
          OANDA_API_TOKEN: ${{ secrets.OANDA_API_TOKEN }}
          OANDA_ACCOUNT_ID: ${{ secrets.OANDA_ACCOUNT_ID }}
          OANDA_ENVIRONMENT: practice
          DISCORD_WEBHOOK_GOLD: ${{ secrets.DISCORD_WEBHOOK_GOLD }}
          DISCORD_WEBHOOK_EURUSD: ${{ secrets.DISCORD_WEBHOOK_EURUSD }}
          DISCORD_WEBHOOK_GBPUSD: ${{ secrets.DISCORD_WEBHOOK_GBPUSD }}
          DISCORD_WEBHOOK_RESULTS: ${{ secrets.DISCORD_WEBHOOK_RESULTS }}
        run: python3 run_once.py

      # The bot's "memory" (which signals it already alerted on, which trades
      # are still open) is saved to small JSON files. GitHub Actions starts
      # fresh every run, so we commit those files back to the repo here -
      # that way the NEXT run picks up where this one left off.
      - name: Save bot memory back to the repo
        run: |
          git config user.name "trading-bot"
          git config user.email "trading-bot@users.noreply.github.com"
          git add alerted_state.json open_trades.json trade_stats.json 2>/dev/null || true
          git diff --quiet --cached || git commit -m "Update bot state [skip ci]"
          git push || true
